name: DSP tests and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: signallab-static-site
          path: dist/index.html
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Test portable distribution
        run: python tests/e2e/browser_smoke.py --hosted
      - name: Test modular site
        run: python tests/e2e/browser_smoke.py --hosted --modular
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: dist/*.png
          if-no-files-found: warn
  scientific-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/reference/requirements.txt
      - run: npm run reference
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-reference-report
          path: dist/scientific-reference.json
